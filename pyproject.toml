[project]
name = "ai-news-bot"
version = "0.1.0"
description = "Telegram bot for scheduled AI news, tools, model releases, repos, and blog alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.2",
    "langfuse>=3.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pymongo>=4.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
