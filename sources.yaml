sources:
  - id: tensorfeed
    name: TensorFeed
    type: json
    url: https://tensorfeed.ai/feed.json
    enabled: true
    segments: [big_tech, model_releases]
    json:
      items_path: items
      title_path: title
      url_path: url
      summary_path: content_text
      published_at_path: date_published
      tags_path: tags
    filters:
      keywords_any:
        - OpenAI
        - Anthropic
        - NVIDIA
        - xAI
        - model
        - release
        - launches
        - API
        - tool

  - id: futuretools_news
    name: FutureTools AI News
    type: html
    url: https://futuretools.io/news
    enabled: true
    segments: [big_tech, model_releases]
    selectors:
      item: a[href]
      title: ""
      link: "@self"
      summary: ""
      published_at: ""
    filters:
      keywords_any:
        - OpenAI
        - Anthropic
        - NVIDIA
        - xAI
        - model
        - releases
        - launches
        - tool

  - id: nvidia_blog
    name: NVIDIA Blog
    type: rss
    url: https://blogs.nvidia.com/feed/
    enabled: true
    segments: [big_tech, model_releases]
    filters:
      keywords_any:
        - AI
        - generative
        - model
        - GPU
        - NVIDIA
        - agent

  - id: producthunt_ai
    name: Product Hunt AI
    type: html
    url: https://www.producthunt.com/topics/artificial-intelligence
    enabled: false
    segments: [tools]
    selectors:
      item: a[href]
      title: ""
      link: "@self"
      summary: ""
      published_at: ""
    filters:
      keywords_any:
        - AI
        - agent
        - LLM
        - tool
        - launched

  - id: nextool_just_landed
    name: Nextool Just Landed AI Tools
    type: supabase_tools
    url: https://bnkmsvdtubbrqtdqoukb.supabase.co/rest/v1/tools
    enabled: true
    segments: [tools]
    supabase:
      anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJua21zdmR0dWJicnF0ZHFvdWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDgxODYsImV4cCI6MjA4NjkyNDE4Nn0.LVLtVonbWXGf0WpMpl_LgODSGq39MEhngQ86mOmxbFo"
      limit: 30
      order: created_at.desc
      filters:
        is_just_landed: eq.true

  - id: github_search_ai
    name: GitHub AI Search
    type: github_search
    url: https://api.github.com/search/repositories
    enabled: true
    segments: [github_repo]
    github:
      q_template: "topic:artificial-intelligence pushed:>={date_7d} stars:>10"
      sort: stars
      order: desc
      per_page: 10

  - id: ossinsight_ai
    name: OSSInsight Trending AI
    type: github_trending_html
    url: https://ossinsight.io/trending/ai
    enabled: true
    segments: [github_repo]
    selectors:
      item: a[href*="github.com/"]
      title: ""
      link: "@self"
      summary: ""
      published_at: ""

  - id: daily_dose_ds_feed
    name: Daily Dose of Data Science Newsletter
    type: rss
    url: https://blog.dailydoseofds.com/feed
    enabled: true
    segments: [daily_dose_ds]

  - id: daily_dose_ds_html
    name: Daily Dose of Data Science Homepage Fallback
    type: html
    url: https://www.dailydoseofds.com/
    enabled: false
    segments: [daily_dose_ds]
    selectors:
      item: a[href]
      title: ""
      link: "@self"
      summary: ""
      published_at: ""
    filters:
      exclude_keywords:
        - Subscribe
        - Sign in
        - Login

  - id: prit_manvar
    name: Prit Manvar
    type: html
    url: https://pritmanvar.in/
    enabled: true
    segments: [prit_blog]
    selectors:
      item: a[href]
      title: ""
      link: "@self"
      summary: ""
      published_at: ""
    filters:
      keywords_any:
        - LLM
        - AI
        - Data
        - Context
        - Interpretability
        - blog

  - id: sebastian_raschka_ahead_of_ai
    name: Sebastian Raschka - Ahead of AI
    type: rss
    url: https://magazine.sebastianraschka.com/feed
    enabled: true
    segments: [sebastian_blog]

  - id: sebastian_raschka_agent_learning
    name: Sebastian Raschka - Agent Learning
    type: rss
    url: https://magazine.sebastianraschka.com/feed
    enabled: true
    segments: [agent_harness_engineering, agent_learning]
    filters:
      keywords_any:
        - agent
        - agents
        - architecture
        - evaluation
        - eval
        - context
        - workflow
        - harness
        - tool
        - memory

  - id: langchain_blog
    name: LangChain Blog
    type: rss
    url: https://www.langchain.com/blog/rss.xml
    enabled: true
    segments: [agent_harness_engineering, agent_learning]
    filters:
      keywords_any:
        - agent
        - agents
        - LangGraph
        - LangSmith
        - evaluation
        - eval
        - memory
        - context
        - workflow
        - tool

  - id: langchain_changelog
    name: LangChain Changelog
    type: rss
    url: https://changelog.langchain.com/feed.xml
    enabled: true
    segments: [agent_harness_engineering]
    filters:
      keywords_any:
        - agent
        - LangGraph
        - LangSmith
        - eval
        - tool
        - memory
        - workflow

  - id: openai_news_agents
    name: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml
    enabled: true
    segments: [agent_harness_engineering]
    filters:
      keywords_any:
        - agent
        - agents
        - tools
        - reasoning
        - evals
        - ChatGPT
